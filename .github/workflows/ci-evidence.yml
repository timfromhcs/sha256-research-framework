name: Evidence Integrity & Anti-Tamper

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  evidence-integrity:
    name: evidence-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Run Evidence Manifest & Artifact Verification
        run: |
          python reproducibility/verify_evidence.py
          python reproducibility/test_determinism.py
          python tools/generate_release_manifest.py --verify
