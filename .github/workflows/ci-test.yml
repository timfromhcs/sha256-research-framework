name: Tests (Windows)

on:
  push:
    branches: [ main, "feature/**", "dev/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install starlette uvicorn psutil z3-solver pytest jsonschema

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vks = Get-ChildItem -Path C:\VulkanSDK -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($vks) {
            echo "VULKAN_SDK=$($vks.FullName)" >> $env:GITHUB_ENV
            echo "$($vks.FullName)\Bin" >> $env:GITHUB_PATH
          }

      - name: Configure CMake
        run: cmake -B build

      - name: Build All Targets (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Run CTest Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Execute Full Python Test Suite
        shell: pwsh
        run: |
          python -m pytest tests/
          if ($LASTEXITCODE -ne 0) { throw "pytest test suite failed with exit code $LASTEXITCODE" }
