name: Tests (Windows)

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b4c99346443341e4b262132a007e44c6d0342c4

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@a50c82f9c3ff443ecae6f9e612f0ea6ddf03cce5
        with:
          vulkan-query-version: 1.3.268.0

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Test Target
        run: cmake --build build --config Release --target sha_tests

      - name: Execute Full Test Suite
        run: .\build\Release\sha_tests.exe
