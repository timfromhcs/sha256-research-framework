name: Release Packaging

# Builds distributable archives for every supported platform and attaches them
# to a GitHub release.
#
# Scope note, deliberate: this workflow builds each artifact on a runner of the
# matching operating system. A binary is never cross-labelled -- there is no
# step anywhere in this repository that renames or re-labels a Windows build as
# macOS or Linux. If a platform cannot be built here, the release ships without
# that asset rather than shipping a mislabelled one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v5.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: ubuntu-latest
            label: linux-x64
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the version to stamp into asset names
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "building $TAG (version ${TAG#v})"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@8be2c3a516086ea7ecf92cf08129e96e85038f8f
        with:
          cmakeVersion: '3.28'

      # CPU-only on purpose: the Vulkan SDK is not present on these runners and
      # is an optional capability. Shipping a package that cannot run would be
      # worse than shipping one without GPU acceleration.
      - name: Configure (CPU only)
        run: >
          cmake -S . -B build
          -DSHA256_ENABLE_VULKAN=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target sha-research sha-verifier context_shaping c3_spectrum

      - name: Smoke test the binaries that were just built
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=build/Release
            EXE=.exe
          else
            BIN=build
            EXE=
          fi
          "$BIN/sha-research$EXE" --version
          "$BIN/sha-verifier$EXE" --version
          "$BIN/sha-verifier$EXE" test-vectors
          "$BIN/context_shaping$EXE" --version
          "$BIN/context_shaping$EXE" selftest
          "$BIN/c3_spectrum$EXE" --version

      - name: Stage the package
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=build/Release
            EXE=.exe
          else
            BIN=build
            EXE=
          fi
          PKG="sha256-research-framework-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          mkdir -p "$PKG/bin" "$PKG/tools" "$PKG/docs"
          cp "$BIN/sha-research$EXE" "$BIN/sha-verifier$EXE" "$BIN/context_shaping$EXE" "$BIN/c3_spectrum$EXE" "$PKG/bin/"
          cp LICENSE README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md "$PKG/"
          cp tools/verify_published.py tools/z3_bitvector_check.py "$PKG/tools/"
          cp -r docs/* "$PKG/docs/"
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        id: archive_win
        shell: pwsh
        run: |
          $name = "${{ steps.stage.outputs.name }}"
          $zip  = "$name.zip"
          Compress-Archive -Path $name -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          "$zip" | Out-File -FilePath archive_file.txt -Encoding ascii -NoNewline
          "$zip.sha256" | Out-File -FilePath archive_digest.txt -Encoding ascii -NoNewline
          "file=$zip" >> $env:GITHUB_OUTPUT

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        id: archive_nix
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.stage.outputs.name }}"
          ARCHIVE="${NAME}.tar.gz"
          tar -czf "$ARCHIVE" "$NAME"
          # macOS provides shasum; GNU Linux provides sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "$ARCHIVE" > archive_file.txt
          echo "$ARCHIVE.sha256" > archive_digest.txt
          echo "file=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.archive_win.outputs.file }}
            ${{ steps.archive_win.outputs.file }}.sha256
          if-no-files-found: error

      - name: Upload build artifact (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.archive_nix.outputs.file }}
            ${{ steps.archive_nix.outputs.file }}.sha256
          if-no-files-found: error

  release:
    name: Attach assets to the GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all built archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: assets
          merge-multiple: true

      - name: List what was actually produced
        run: ls -la assets

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "$TAG -- SHA-256 Research Framework" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
