name: Release Packaging

# Builds distributable archives for every supported platform and attaches them
# to a GitHub release.
#
# Scope note, deliberate: this workflow builds each artifact on a runner of the
# matching operating system. A binary is never cross-labelled -- there is no
# step anywhere in this repository that renames or re-labels a Windows build as
# macOS or Linux. If a platform cannot be built here, the release ships without
# that asset rather than shipping a mislabelled one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v5.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: ubuntu-latest
            label: linux-x64
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from the tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmakeVersion: '3.28'

      # CPU-only on purpose: the Vulkan SDK is not present on these runners and
      # is an optional capability. Shipping a package that cannot run would be
      # worse than shipping one without GPU acceleration.
      - name: Configure (CPU only)
        run: >
          cmake -S . -B build
          -DSHA256_ENABLE_VULKAN=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target sha-research sha-verifier context_shaping

      - name: Smoke test the binaries that were just built
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=build/Release
          else
            BIN=build
          fi
          "$BIN/sha-verifier" test-vectors
          "$BIN/context_shaping" selftest

      - name: Stage the package
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=build/Release; else BIN=build; fi
          PKG="sha256-research-framework-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          mkdir -p "$PKG/bin" "$PKG/tools" "$PKG/docs"
          cp "$BIN/sha-research" "$BIN/sha-verifier" "$BIN/context_shaping" "$PKG/bin/"
          cp LICENSE README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md "$PKG/"
          cp tools/verify_published.py tools/z3_bitvector_check.py "$PKG/tools/"
          cp docs/research/advanced-strategies.md \
             docs/research/verification.md \
             docs/research/terminology.md "$PKG/docs/"
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      # Archiving is split per platform on purpose. Three earlier bugs lived in
      # a single cross-platform step: Windows runners have no `zip`, macOS
      # ships `shasum` rather than `sha256sum`, and a step cannot read its own
      # `steps.<id>.outputs` while producing them.
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        id: archive_win
        shell: pwsh
        run: |
          $name = "${{ steps.stage.outputs.name }}"
          $zip  = "$name.zip"
          Compress-Archive -Path $name -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          "$zip" | Out-File -FilePath archive_file.txt -Encoding ascii -NoNewline
          "$zip.sha256" | Out-File -FilePath archive_digest.txt -Encoding ascii -NoNewline
          "file=$zip" >> $env:GITHUB_OUTPUT

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        id: archive_nix
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.stage.outputs.name }}"
          ARCHIVE="${NAME}.tar.gz"
          tar -czf "$ARCHIVE" "$NAME"
          # macOS provides shasum; GNU Linux provides sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "$ARCHIVE" > archive_file.txt
          echo "$ARCHIVE.sha256" > archive_digest.txt
          echo "file=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.archive_win.outputs.file }}
            ${{ steps.archive_win.outputs.file }}.sha256
          if-no-files-found: error

      - name: Upload build artifact (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.archive_nix.outputs.file }}
            ${{ steps.archive_nix.outputs.file }}.sha256
          if-no-files-found: error

  release:
    name: Attach assets to the GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List what was actually produced
        run: ls -la assets

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "v5.0.0 -- Context Shaping: 19-Round SHA-256 Preimages" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi